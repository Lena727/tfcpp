modLoader = "javafml"
loaderVersion = "[4,)"
license = "EUPL-1.2"

[[mods]]
    modId = "tfcpp"
    version = "${mod_version}"
    displayName = "TFC++"
    description = '''The industrial continuation of TerraFirmaCraft: coal chemistry, acids, oil, polymers and electricity under real physics.'''

[[dependencies.tfcpp]]
    modId = "tfc"
    type = "required"
    versionRange = "[${tfc_version}]"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.tfcpp]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neoforge_version},)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.tfcpp]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${minecraft_version}]"
    ordering = "AFTER"
    side = "BOTH"

[[mixins]]
    config = "tfcpp.mixins.json"
